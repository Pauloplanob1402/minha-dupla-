<!--
  Cole isso em: Supabase > Authentication > Email Templates > Change Email Address
  (é esse template que dispara quando um usuário anônimo vincula um e-mail,
  que é o fluxo usado no botão "Salvar meus pontos" do DUOS)

  Assunto sugerido: Confirme seu e-mail no DUOS 💜
-->
<div style="background-color:#0B0B0E; padding:40px 20px; font-family:Arial, sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px; margin:0 auto;">
    <tr>
      <td style="text-align:center; padding-bottom:24px;">
        <span style="font-size:22px; font-weight:800; color:#ffffff; letter-spacing:-0.5px;">DUOS</span>
      </td>
    </tr>
    <tr>
      <td style="background-color:#151519; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:32px 28px; text-align:center;">
        <p style="font-size:20px; font-weight:700; color:#ffffff; margin:0 0 12px;">
          Bem-vindo(a) ao DUOS 👋
        </p>
        <p style="font-size:14px; color:#a1a1aa; line-height:1.6; margin:0 0 24px;">
          Confirme seu e-mail pra garantir sua conta e não perder seus Vibe Points
          conquistados até agora.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block; background:linear-gradient(95deg,#8B5CF6,#EC4899); color:#ffffff; text-decoration:none; font-weight:700; font-size:14px; padding:14px 28px; border-radius:14px;">
          Confirmar meu e-mail
        </a>
        <p style="font-size:12px; color:#71717a; margin:24px 0 0;">
          Se você não pediu isso, pode ignorar este e-mail com tranquilidade.
        </p>
      </td>
    </tr>
    <tr>
      <td style="text-align:center; padding-top:20px;">
        <p style="font-size:11px; color:#52525b; margin:0;">
          DUOS · Nunca faça nada sozinho.
        </p>
      </td>
    </tr>
  </table>
</div>
